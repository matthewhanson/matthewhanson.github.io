<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 450" role="img"
     aria-label="An archive of millions of scenes; the handful an analysis used are written to a small stac-geoparquet file of 269 kilobytes; that file's asset links still point at the imagery in cloud storage, which is never copied.">
  <title>The snapshot</title>

  <defs>
    <style>
      .ink   { fill: #1b2233; }
      .muted { fill: #8a8272; }
      .red   { fill: #8c2f2f; }
      .brass { fill: #b8894b; }
      .card  { fill: #f5efe1; stroke: #1b2233; stroke-width: 1.5; }
      .cell  { fill: none; stroke: #1b2233; stroke-width: 1; opacity: .35; }
      .hot   { fill: #8c2f2f; opacity: .8; }
      .hair  { fill: none; stroke: #1b2233; stroke-width: 1.1; opacity: .4; }
      .flow  { fill: none; stroke: #8c2f2f; stroke-width: 1.8; }
      .lead  { fill: none; stroke: #8c2f2f; stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .85; }
      .disp  { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans  { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    </style>
    <marker id="s-arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c2f2f"/>
    </marker>
  </defs>

  <!-- ══ the archive ══ -->
  <text class="mono brass" x="34" y="66" font-size="14" letter-spacing="1.5">THE ARCHIVE</text>
  <rect class="card" x="34" y="84" width="246" height="204"/>
  <g>
    <!-- 9 x 7 grid of scenes -->
    <g class="cell">
      <rect x="48"  y="98"  width="18" height="18"/><rect x="74"  y="98"  width="18" height="18"/><rect x="100" y="98"  width="18" height="18"/><rect x="126" y="98"  width="18" height="18"/><rect x="152" y="98"  width="18" height="18"/><rect x="178" y="98"  width="18" height="18"/><rect x="204" y="98"  width="18" height="18"/><rect x="230" y="98"  width="18" height="18"/>
      <rect x="48"  y="124" width="18" height="18"/><rect x="74"  y="124" width="18" height="18"/><rect x="100" y="124" width="18" height="18"/><rect x="152" y="124" width="18" height="18"/><rect x="178" y="124" width="18" height="18"/><rect x="204" y="124" width="18" height="18"/><rect x="230" y="124" width="18" height="18"/>
      <rect x="48"  y="150" width="18" height="18"/><rect x="100" y="150" width="18" height="18"/><rect x="126" y="150" width="18" height="18"/><rect x="152" y="150" width="18" height="18"/><rect x="178" y="150" width="18" height="18"/><rect x="230" y="150" width="18" height="18"/>
      <rect x="48"  y="176" width="18" height="18"/><rect x="74"  y="176" width="18" height="18"/><rect x="100" y="176" width="18" height="18"/><rect x="126" y="176" width="18" height="18"/><rect x="178" y="176" width="18" height="18"/><rect x="204" y="176" width="18" height="18"/><rect x="230" y="176" width="18" height="18"/>
      <rect x="48"  y="202" width="18" height="18"/><rect x="74"  y="202" width="18" height="18"/><rect x="126" y="202" width="18" height="18"/><rect x="152" y="202" width="18" height="18"/><rect x="178" y="202" width="18" height="18"/><rect x="204" y="202" width="18" height="18"/><rect x="230" y="202" width="18" height="18"/>
      <rect x="48"  y="228" width="18" height="18"/><rect x="74"  y="228" width="18" height="18"/><rect x="100" y="228" width="18" height="18"/><rect x="126" y="228" width="18" height="18"/><rect x="152" y="228" width="18" height="18"/><rect x="204" y="228" width="18" height="18"/><rect x="230" y="228" width="18" height="18"/>
      <rect x="48"  y="254" width="18" height="18"/><rect x="74"  y="254" width="18" height="18"/><rect x="100" y="254" width="18" height="18"/><rect x="126" y="254" width="18" height="18"/><rect x="152" y="254" width="18" height="18"/><rect x="178" y="254" width="18" height="18"/><rect x="204" y="254" width="18" height="18"/>
    </g>
    <!-- the ones this analysis used -->
    <g class="hot">
      <rect x="126" y="124" width="18" height="18"/>
      <rect x="74"  y="150" width="18" height="18"/>
      <rect x="204" y="150" width="18" height="18"/>
      <rect x="152" y="176" width="18" height="18"/>
      <rect x="100" y="202" width="18" height="18"/>
      <rect x="178" y="228" width="18" height="18"/>
      <rect x="230" y="254" width="18" height="18"/>
    </g>
  </g>
  <text class="sans muted" x="34" y="312" font-size="14">millions of scenes, and moving</text>

  <!-- ══ the snapshot ══ -->
  <path class="flow" marker-end="url(#s-arw)" d="M 292 186 L 356 186"/>
  <text class="mono muted" x="288" y="172" font-size="12">the ones you used</text>

  <text class="mono brass" x="374" y="66" font-size="14" letter-spacing="1.5">THE SNAPSHOT</text>
  <rect class="card" x="374" y="110" width="252" height="152"/>
  <text class="mono ink"   x="392" y="140" font-size="14">scenes.parquet</text>
  <line class="hair" x1="392" y1="152" x2="608" y2="152"/>
  <text class="mono red"   x="392" y="176" font-size="12">S2A_MSIL2A_20220613...</text>
  <text class="mono red"   x="392" y="196" font-size="12">S2B_MSIL2A_20220618...</text>
  <text class="mono red"   x="392" y="216" font-size="12">S2A_MSIL2A_20220703...</text>
  <text class="mono muted" x="392" y="240" font-size="12">+ 4 more, with checksums</text>
  <text class="sans ink"   x="374" y="290" font-size="17" font-weight="700">269 KB</text>
  <text class="sans muted" x="374" y="312" font-size="14">it travels with the paper</text>

  <!-- ══ the pixels ══ -->
  <path class="lead" marker-end="url(#s-arw)" d="M 638 186 L 706 186"/>
  <text class="mono muted" x="632" y="172" font-size="12">asset hrefs</text>

  <text class="mono brass" x="724" y="66" font-size="14" letter-spacing="1.5">THE PIXELS</text>
  <rect class="card" x="724" y="110" width="286" height="152"/>
  <text class="mono ink"   x="742" y="146" font-size="13">s3://sentinel-cogs/...</text>
  <text class="mono muted" x="742" y="172" font-size="13">B04.tif  B08.tif  SCL.tif</text>
  <line class="hair" x1="742" y1="192" x2="992" y2="192"/>
  <text class="sans ink"   x="742" y="222" font-size="15">stay exactly where</text>
  <text class="sans ink"   x="742" y="244" font-size="15">they already are</text>
  <text class="sans muted" x="724" y="290" font-size="17" font-weight="700">terabytes</text>
  <text class="sans muted" x="724" y="312" font-size="14">nothing is copied</text>

  <line class="hair" x1="34" y1="352" x2="1010" y2="352"/>
  <text class="sans ink" x="34" y="388" font-size="16">The paper cites the snapshot. The snapshot points at the pixels.</text>
  <text class="sans muted" x="34" y="414" font-size="14">Freeze the metadata, not the imagery.</text>
</svg>
